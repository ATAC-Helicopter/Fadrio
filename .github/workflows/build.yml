name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push followed by its pull request should share one run, not consume two
  # Linux/native runner pairs for the same branch revision.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.3xx
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libpipewire-0.3-dev libspa-0.2-dev libasound2-dev pipewire-bin ripgrep
      - name: Build
        run: ./scripts/build.sh
      - name: Audit roadmap identifiers
        run: |
          python3 scripts/roadmap_audit.py
          python3 -m unittest discover -s tests/scripts -p 'test_*.py'
      - name: Test
        run: |
          ctest --test-dir build/native --output-on-failure
          dotnet test Fadrio.slnx --configuration Debug --no-build
      - name: Isolated PipeWire integration test
        run: ./scripts/test-pipewire-integration.sh

  native-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.3xx
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libpipewire-0.3-dev libspa-0.2-dev libasound2-dev pipewire-bin ripgrep
      - name: Build with ASAN and UBSAN
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: ./scripts/build.sh
      - name: Test native lifecycle under sanitizers
        run: ctest --test-dir build/native --output-on-failure
      - name: Test PipeWire churn and reconnect under sanitizers
        run: |
          export FADRIO_SANITIZER_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)"
          ./scripts/test-pipewire-integration.sh
